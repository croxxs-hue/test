name: Demo - Detect & Run Containers

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:

  detect:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.detect_folders.outputs.folders }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine diff range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.base_ref }}...${{ github.head_ref }}" >> $GITHUB_OUTPUT
          else
            echo "range=HEAD~1 HEAD" >> $GITHUB_OUTPUT
          fi

      - name: Check if version.txt changed
        id: version_changed
        run: |
          if git diff --name-only ${{ steps.range.outputs.range }} | grep -q "version.txt"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if version not updated
        if: steps.version_changed.outputs.changed == 'false'
        run: |
          echo "version.txt not changed, skipping all services."
          echo "folders=[]" >> $GITHUB_OUTPUT

      - name: Detect changed folders
        id: detect_folders
        if: steps.version_changed.outputs.changed == 'true'
        run: |
          CHANGED=$(git diff --name-only ${{ steps.range.outputs.range }} | cut -d/ -f1 | sort -u)

          FILTERED=()
          for f in $CHANGED; do
            if [ -d "$f" ]; then
              FILTERED+=("$f")
            fi
          done

          if [ ${#FILTERED[@]} -eq 0 ]; then
            JSON="[]"
          else
            JSON=$(printf '%s\n' "${FILTERED[@]}" | jq -R . | jq -s .)
          fi

          echo "folders=$JSON" >> $GITHUB_OUTPUT
          echo "Changed service folders: $JSON"


  run-services:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.folders != '[]'

    strategy:
      matrix:
        folder: ${{ fromJson(needs.detect.outputs.folders) }}

    steps:
      - uses: actions/checkout@v4

      - name: Processing service
        run: echo "Service detected: ${{ matrix.folder }}"

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.folder }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build container
        if: steps.check.outputs.exists == 'true'
        run: |
          IMAGE="${{ matrix.folder }}:ci"
          echo "Building image $IMAGE from folder '${{ matrix.folder }}'"
          docker build -t "$IMAGE" "${{ matrix.folder }}"

      - name: Run container
        if: steps.check.outputs.exists == 'true'
        run: |
          IMAGE="${{ matrix.folder }}:ci"
          NAME="${{ matrix.folder }}-run"

          echo "Running container: $NAME"
          docker run -d --name "$NAME" "$IMAGE"

          echo "Waiting for container startup..."
          sleep 3

          echo "===== Container Logs ====="
          docker logs "$NAME"

          echo "Stopping container..."
          docker stop "$NAME" || true

          echo "Removing container..."
          docker rm "$NAME" || true

      - name: Dockerfile missing - skip
        if: steps.check.outputs.exists == 'false'
        run: echo "Skipping '${{ matrix.folder }}' → No Dockerfile found."
